  <script>
const match = location.pathname.match(/(\d+\.\d+\.\d+)/);
if (match) {
  document.querySelectorAll('.page-version').forEach(el => el.textContent = match[1]);
  document.getElementById('download-link').href = `https://pyrotracksystem.com/download/PyroTrack_Setup_${match[1]}.exe`;
}
</script>
  <script>
    /* ── Nav active ── */
    function setActive(el) {
      document.querySelectorAll('.nav-link').forEach(l => l.classList.remove('active'));
      el.classList.add('active');
      document.getElementById('navLinks').classList.remove('open');
    }

    /* ── Burger mobile ── */
    function toggleMenu() {
      document.getElementById('navLinks').classList.toggle('open');
    }

    /* ── Active nav via scroll ── */
    const sections = document.querySelectorAll('section[id]');
    const navLinks = document.querySelectorAll('.nav-link');

    const observer = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          navLinks.forEach(link => {
            link.classList.remove('active');
            if (link.getAttribute('href') === `#${entry.target.id}`) {
              link.classList.add('active');
            }
          });
        }
      });
    }, { threshold: 0.4 });

    sections.forEach(s => observer.observe(s));

    /* ── Reveal au scroll ── */
    const reveals = document.querySelectorAll('.reveal');
    const revealObs = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          entry.target.classList.add('visible');
        }
      });
    }, { threshold: 0.12 });

    reveals.forEach(el => revealObs.observe(el));
    
  </script>
  <script>
  const patchNotes = [
  { tag: 'SECTION', text: 'Mises à jour' },
  { tag: 'CHG', tagClass: 'pn-tag--chg', text: 'Possibilité d\'ignorer, reporter ou télécharger une mise à jour logiciel.' },
  { tag: 'CHG', tagClass: 'pn-tag--chg', text: 'Possibilité d\'ignorer, reporter ou télécharger une mise à jour du catalogue.' },

  { tag: 'SECTION', text: 'Language' },
  { tag: 'NEW', tagClass: 'pn-tag--new', text: 'Ajout de l\'anglais et du choix de langues sur l\'app.' },

  { tag: 'SECTION', text: 'Librairie' },
  { tag: 'NEW', tagClass: 'pn-tag--new', text: 'Mise à jour de la librairie de composants.' },

  { tag: 'SECTION', text: 'Groupes' },
  { tag: 'NEW', tagClass: 'pn-tag--new', text: 'Ajout des shortcuts pour différents éléments.' },
  { tag: 'FIX', tagClass: 'pn-tag--fix', text: 'Mise en place du choix de Tanks dès la création d\'un nouveau groupe.' },
];


  const container = document.getElementById('patchnote-container');

  patchNotes.forEach(item => {
  const li = document.createElement('li');
  
  if (item.tag === 'SECTION') {
    li.className = 'pn-section';
    li.textContent = item.text;
  } else {
    li.className = 'pn-item';
    // Ajout de la classe dynamique ici :
    li.innerHTML = `
      <span class="pn-tag ${item.tagClass}">${item.tag}</span>
      <span class="pn-item-text">${item.text}</span>
    `;
  }
  container.appendChild(li);
});
</script>

<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PyroTrack System — Système de suivi de consommation</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;900&family=Barlow:wght@400;500;600&family=Share+Tech+Mono&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../style.css">
</head>
<body>

  
<div id="header-placeholder"></div>
<main>
  <!-- ── CONTACT ───────────────────────────────── -->
  <section id="contact">
    <div class="section-inner">
      <h2 class="section-title reveal reveal-delay-1" style="text-align: center;">Contacter Pyro<em>Track</em>System.</h2>

      <div class="download-grid">
        <div>
          <p class="section-desc reveal reveal-delay-2" style="margin-left: auto; margin-right: auto; width: fit-content;">
  Pour toutes question concernant le logiciel, les fonctionnalités, ou pour signaler un bug, vous pouvez nous contacter via le formulaire ci-dessous.
  </p>
        </div>
      </div>
    </div>
<form id="contact-form" action="https://formspree.io/f/mdavbwlq" method="POST" style="margin-top: 2rem;" class="contact-form">
  <label>Nom :</label>
  <input type="text" name="nom" required>

  <label>Prénom :</label>
  <input type="text" name="prenom" required>

  <label>Adresse e-mail :</label>
  <input type="email" name="email" required>

  <label>Objet :</label>
  <input type="text" name="objet" required>

  <label>Message :</label>
  <textarea name="message" required></textarea>

  <button type="submit">Envoyer</button>
  <p id="form-status" style="margin-top: 10px; font-size: 0.9rem;"></p>
</form>
  </section>
  <hr class="red-rule">

</main>
  <div id="footer-placeholder"></div>
</body>
  <script src="../js/components.js"></script>
  <script>
  const form = document.getElementById("contact-form");
  const status = document.getElementById("form-status");

  async function handleSubmit(event) {
    event.preventDefault();
    
    // Affichage d'un message de chargement
    status.textContent = "Envoi en cours...";
    status.style.color = "var(--light)"; 

    const data = new FormData(event.target);
    
    const response = await fetch(event.target.action, {
      method: form.method,
      body: data,
      headers: { 'Accept': 'application/json' }
    });

    if (response.ok) {
      // Redirection après succès
      status.textContent = "Message envoyé ! ";
      status.style.color = "var(--green)";
    } else {
      status.textContent = "Erreur lors de l'envoi. Veuillez réessayer.";
      status.style.color = "var(--red-bright)";
    }
  }

  form.addEventListener("submit", handleSubmit);
</script>
  <script>
    /* ── Nav active ── */
    function setActive(el) {
      document.querySelectorAll('.nav-link').forEach(l => l.classList.remove('active'));
      el.classList.add('active');
      document.getElementById('navLinks').classList.remove('open');
    }

    /* ── Burger mobile ── */
    function toggleMenu() {
      document.getElementById('navLinks').classList.toggle('open');
    }

    /* ── Active nav via scroll ── */
    const sections = document.querySelectorAll('section[id]');
    const navLinks = document.querySelectorAll('.nav-link');

    const observer = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          navLinks.forEach(link => {
            link.classList.remove('active');
            if (link.getAttribute('href') === `#${entry.target.id}`) {
              link.classList.add('active');
            }
          });
        }
      });
    }, { threshold: 0.4 });

    sections.forEach(s => observer.observe(s));

    /* ── Reveal au scroll ── */
    const reveals = document.querySelectorAll('.reveal');
    const revealObs = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          entry.target.classList.add('visible');
        }
      });
    }, { threshold: 0.12 });

    reveals.forEach(el => revealObs.observe(el));
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="fr">
<head>
    <link rel="icon" type="image/png" href="../images/icon.png">
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PyroTrack System — Système de suivi de consommation</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;900&family=Barlow:wght@400;500;600&family=Share+Tech+Mono&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../style.css">
</head>
<body>
<div id="header-placeholder"></div>
<main>
  <!-- ── Téléchargement ───────────────────────────────── -->
  <section id="download">
    <div class="section-inner">
      <h2 class="section-title reveal reveal-delay-1">Téléchargez Pyro<em>Track</em>System<br>pour Windows.</h2>

      <div class="download-grid">
        <div>
          <p class="section-desc reveal reveal-delay-2" style="margin-left: auto; margin-right: auto; width: fit-content;">
  Le logiciel est actuellement en version bêta et est disponible pour les utilisateurs Windows.
</p>
<div class="download-container reveal reveal-delay-4" style="margin-top: 2rem;">
  <!-- Bouton de téléchargement principal -->
  <a id="download-link" href="#" class="btn-primary">
    Chargement...
  </a>
  
  <!-- Informations complémentaires -->
          <p class="section-desc reveal reveal-delay-2" style="margin-left: auto; margin-right: auto; width: fit-content;">
    Disponible pour Windows (x64)
  </p>
  <a id="changelog-link" href="#" class="btn-log">Voir les nouveautés</a></div>
        </div>
      </div>
    </div>
  </section>
  <hr class="red-rule">

  <!-- ── Anciennes versions ───────────────────────────── -->
  <section id="old-versions">
    <div class="section-inner">
      <h2 class="section-title reveal reveal-delay-1">Anciennes <em>Versions</em></h2>
      <div id="old-versions-container" class="download-grid old-versions-grid">
      </div>
    </div>
  </section>

</main>
  <hr class="red-rule">
<div id="footer-placeholder"></div>

</body>
  <script src="../js/components.js"></script>
  <script>
    /* ── Nav active ── */
    function setActive(el) {
      document.querySelectorAll('.nav-link').forEach(l => l.classList.remove('active'));
      el.classList.add('active');
      document.getElementById('navLinks').classList.remove('open');
    }

    /* ── Burger mobile ── */
    function toggleMenu() {
      document.getElementById('navLinks').classList.toggle('open');
    }

    /* ── Active nav via scroll ── */
    const sections = document.querySelectorAll('section[id]');
    const navLinks = document.querySelectorAll('.nav-link');

    const observer = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          navLinks.forEach(link => {
            link.classList.remove('active');
            if (link.getAttribute('href') === `#${entry.target.id}`) {
              link.classList.add('active');
            }
          });
        }
      });
    }, { threshold: 0.4 });

    sections.forEach(s => observer.observe(s));

    /* ── Reveal au scroll ── */
    const reveals = document.querySelectorAll('.reveal');
    const revealObs = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          entry.target.classList.add('visible');
        }
      });
    }, { threshold: 0.12 });

    reveals.forEach(el => revealObs.observe(el));
  </script>
  <script> //Gestion de la dernière version disponible pour le téléchargement
  async function updateDownloadButton() {
    try {
      // Appel vers votre API
      const response = await fetch('https://licence-pyrotrack-gen.onrender.com/latest-version');
      const data = await response.json();
      
      // Récupération de l'élément HTML
      const btn = document.getElementById('download-link');
      
      // Mise à jour du lien et du texte
      btn.href = data.downloadUrl;
      btn.textContent = `Télécharger PyroTrack v${data.version}`;
      const logLink = document.getElementById('changelog-link');
      logLink.href = `/changelog/${data.version}.html`;
    } catch (error) {
      console.error("Erreur lors de la récupération de la version :", error);
      // Optionnel : remettre un lien par défaut en cas d'échec
      document.getElementById('download-link').textContent = "Télécharger PyroTrack";
    }
  }

  updateDownloadButton();
</script>
<script>

  const allVersions = ['1.0.2'];

  async function buildOldVersions() {
    try {
      const response = await fetch('https://licence-pyrotrack-gen.onrender.com/latest-version');
      const data = await response.json();
      const currentVersion = data.version;

      const container = document.getElementById('old-versions-container');
      const oldVersions = allVersions.filter(v => v !== currentVersion);

      if (oldVersions.length === 0) {
        container.innerHTML = '<p class="section-desc">Aucune ancienne version disponible.</p>';
        return;
      }

      oldVersions.forEach(version => {
        const a = document.createElement('a');
        a.href = `../changelog/${version}.html`;
        a.className = 'btn-log';
        a.textContent = `Version ${version}`;
        container.appendChild(a);
      });
    } catch (error) {
      console.error("Erreur lors de la construction des anciennes versions :", error);
    }
  }

  buildOldVersions();
</script>
</body>
</html>

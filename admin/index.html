<!DOCTYPE html>
<html lang="fr">
<head>
  <link rel="icon" type="image/png" href="../images/icon.png">
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PyroTrack System — Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;900&family=Barlow:wght@400;500;600&family=Share+Tech+Mono&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../style.css">
  <style>
    /* ── Layout général ── */
    body { background: #0a0a0a; color: #e0e0e0; }

    /* ── Login overlay ── */
    #login-overlay {
      position: fixed; inset: 0;
      background: #0a0a0a;
      display: flex; align-items: center; justify-content: center;
      z-index: 999;
    }
    .login-box {
      background: #111;
      border: 1px solid #2a2a2a;
      border-top: 3px solid #e63030;
      border-radius: 8px;
      padding: 2.5rem 3rem;
      width: 100%;
      max-width: 380px;
      display: flex; flex-direction: column; gap: 1.2rem;
    }
    .login-box h2 {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 1.6rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: #fff;
      margin: 0 0 0.5rem;
    }
    .login-box h2 em { color: #e63030; font-style: normal; }
    .login-field {
      display: flex; flex-direction: column; gap: 0.4rem;
    }
    .login-field label {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 0.85rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: #888;
    }
    .login-field input {
      background: #1a1a1a;
      border: 1px solid #2a2a2a;
      border-radius: 4px;
      padding: 0.65rem 0.9rem;
      color: #fff;
      font-family: 'Share Tech Mono', monospace;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s;
    }
    .login-field input:focus { border-color: #e63030; }

    /* ── Remember me ── */
    .login-remember {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      cursor: pointer;
    }
    .login-remember input[type="checkbox"] {
      width: 15px; height: 15px;
      accent-color: #e63030;
      cursor: pointer;
    }
    .login-remember span {
      font-family: 'Barlow', sans-serif;
      font-size: 0.85rem;
      color: #666;
      user-select: none;
    }

    .login-error {
      color: #e63030;
      font-family: 'Barlow', sans-serif;
      font-size: 0.85rem;
      min-height: 1.2em;
      text-align: center;
    }
    .btn-login {
      background: #e63030;
      color: #fff;
      border: none;
      border-radius: 4px;
      padding: 0.75rem;
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 1rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      cursor: pointer;
      transition: background 0.2s, opacity 0.2s;
    }
    .btn-login:hover:not(:disabled) { background: #c02020; }
    .btn-login:disabled { opacity: 0.5; cursor: not-allowed; }

    /* ── Dashboard ── */
    #dashboard { display: none; padding: calc(64px + 3rem) 2rem 3rem; max-width: 900px; margin: 0 auto; }
    .dashboard-header {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 2.5rem;
    }
    .dashboard-header h1 {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 2rem; font-weight: 900;
      text-transform: uppercase; letter-spacing: 0.05em;
      color: #fff; margin: 0;
    }
    .dashboard-header h1 em { color: #e63030; font-style: normal; }
    .btn-logout {
      background: transparent;
      border: 1px solid #444;
      color: #888;
      border-radius: 4px;
      padding: 0.4rem 1rem;
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 0.85rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      cursor: pointer;
      transition: border-color 0.2s, color 0.2s;
    }
    .btn-logout:hover { border-color: #e63030; color: #e63030; }

    /* ── Cards stats ── */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 1rem;
      margin-bottom: 2.5rem;
    }
    .stat-card {
      background: #111;
      border: 1px solid #2a2a2a;
      border-radius: 6px;
      padding: 1.2rem 1.5rem;
    }
    .stat-card .stat-label {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 0.8rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #666;
      margin-bottom: 0.4rem;
    }
    .stat-card .stat-value {
      font-family: 'Share Tech Mono', monospace;
      font-size: 2rem;
      color: #e63030;
      font-weight: 700;
    }

    /* ── Tableau ── */
    .section-label {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 1rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #666;
      margin-bottom: 1rem;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-family: 'Share Tech Mono', monospace;
      font-size: 0.9rem;
    }
    thead tr { border-bottom: 2px solid #e63030; }
    thead th {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 0.8rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: #888;
      text-align: left;
      padding: 0.5rem 0.8rem;
    }
    tbody tr {
      border-bottom: 1px solid #1e1e1e;
      transition: background 0.15s;
    }
    tbody tr:hover { background: #141414; }
    tbody td { padding: 0.7rem 0.8rem; color: #ccc; }
    tbody td:last-child { color: #e63030; font-weight: 700; }

    /* ── Bar chart ── */
    .bar-wrap { display: flex; align-items: center; gap: 0.8rem; }
    .bar-bg { flex: 1; height: 6px; background: #1e1e1e; border-radius: 3px; overflow: hidden; }
    .bar-fill { height: 100%; background: #e63030; border-radius: 3px; transition: width 0.6s ease; }

    /* ── Loading / spinner ── */
    .loading-text {
      font-family: 'Share Tech Mono', monospace;
      color: #444; font-size: 0.9rem; text-align: center; padding: 2rem;
    }
    .btn-login.loading::after {
      content: '';
      display: inline-block;
      width: 12px; height: 12px;
      border: 2px solid #fff;
      border-top-color: transparent;
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
      margin-left: 0.6rem;
      vertical-align: middle;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div id="header-placeholder"></div>

<!-- ── Login ── -->
<div id="login-overlay">
  <div class="login-box">
    <h2>Pyro<em>Track</em><br>Admin</h2>

    <div class="login-field">
      <label>Utilisateur</label>
      <input type="text" id="input-user" autocomplete="username" placeholder="Utilisateur" />
    </div>

    <div class="login-field">
      <label>Mot de passe</label>
      <input type="password" id="input-pass" autocomplete="current-password" placeholder="••••••••••••" />
    </div>

    <label class="login-remember">
      <input type="checkbox" id="input-remember" />
      <span>Se souvenir de moi (30 jours)</span>
    </label>

    <p class="login-error" id="login-error"></p>
    <button class="btn-login" id="btn-login">Connexion</button>
  </div>
</div>

<!-- ── Dashboard ── -->
<div id="dashboard">
  <div class="dashboard-header">
    <h1>Pyro<em>Track</em> — Stats</h1>
    <button class="btn-logout" id="btn-logout">Déconnexion</button>
  </div>

  <div class="stats-grid">
    <div class="stat-card">
      <div class="stat-label">Total téléchargements</div>
      <div class="stat-value" id="stat-total">—</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Versions suivies</div>
      <div class="stat-value" id="stat-versions">—</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Version la + téléchargée</div>
      <div class="stat-value" id="stat-top" style="font-size:1.3rem; padding-top: 0.3rem;">—</div>
    </div>
  </div>

  <p class="section-label">Détail par version</p>
  <div id="table-container">
    <p class="loading-text">Chargement des données...</p>
  </div>
</div>

<div id="footer-placeholder"></div>
<script src="../js/i18n.js"></script>
<script src="../js/components.js"></script>
<script>
  /* ─── Config ──────────────────────────────────────────────────────────────── */
  const API_BASE   = 'https://licence-pyrotrack-gen.onrender.com';
  const TOKEN_KEY  = 'adm_token';   // clé localStorage

  /* ─── Éléments DOM ───────────────────────────────────────────────────────── */
  const overlay   = document.getElementById('login-overlay');
  const dashboard = document.getElementById('dashboard');
  const errorEl   = document.getElementById('login-error');
  const btnLogin  = document.getElementById('btn-login');

  /* ─── Token helpers ──────────────────────────────────────────────────────── */
  function saveToken(token) {
    localStorage.setItem(TOKEN_KEY, token);
  }
  function getToken() {
    return localStorage.getItem(TOKEN_KEY);
  }
  function clearToken() {
    localStorage.removeItem(TOKEN_KEY);
  }

  /* ─── Affichage dashboard ────────────────────────────────────────────────── */
  function showDashboard() {
    overlay.style.display  = 'none';
    dashboard.style.display = 'block';
    loadStats();
  }

  /* ─── Vérification du token au chargement ───────────────────────────────── */
  async function checkExistingSession() {
    const token = getToken();
    if (!token) return;

    try {
      const res = await fetch(`${API_BASE}/admin/verify`, {
        headers: { 'Authorization': `Bearer ${token}` }
      });
      if (res.ok) {
        showDashboard();
      } else {
        clearToken(); // Token expiré ou invalide
      }
    } catch {
      // Serveur injoignable — on reste sur le login
    }
  }

  /* ─── Login ──────────────────────────────────────────────────────────────── */
  async function tryLogin() {
    const username = document.getElementById('input-user').value.trim();
    const password = document.getElementById('input-pass').value;
    const remember = document.getElementById('input-remember').checked;

    if (!username || !password) {
      errorEl.textContent = 'Veuillez remplir tous les champs.';
      return;
    }

    // UI loading
    btnLogin.disabled = true;
    btnLogin.classList.add('loading');
    btnLogin.textContent = 'Connexion';
    errorEl.textContent = '';

    try {
      const res = await fetch(`${API_BASE}/admin/login`, {
        method:  'POST',
        headers: { 'Content-Type': 'application/json' },
        body:    JSON.stringify({ username, password, remember }),
      });

      const data = await res.json();

      if (res.ok && data.ok && data.token) {
        saveToken(data.token);
        showDashboard();
      } else {
        errorEl.textContent = data.error ?? 'Identifiants incorrects.';
      }
    } catch {
      errorEl.textContent = 'Impossible de joindre le serveur.';
    } finally {
      btnLogin.disabled = false;
      btnLogin.classList.remove('loading');
    }
  }

  /* ─── Events ─────────────────────────────────────────────────────────────── */
  btnLogin.addEventListener('click', tryLogin);
  document.addEventListener('keydown', e => { if (e.key === 'Enter') tryLogin(); });

  document.getElementById('btn-logout').addEventListener('click', () => {
    clearToken();
    location.reload();
  });

  /* ─── Chargement stats ───────────────────────────────────────────────────── */
  async function loadStats() {
    const token = getToken();
    try {
      const res  = await fetch(`${API_BASE}/download-stats`, {
        headers: token ? { 'Authorization': `Bearer ${token}` } : {}
      });
      const data = await res.json();
      const stats = data.stats;

      const total = stats.reduce((sum, s) => sum + s.total, 0);
      const top   = stats[0];
      const max   = top ? top.total : 1;

      document.getElementById('stat-total').textContent    = total;
      document.getElementById('stat-versions').textContent = stats.length;
      document.getElementById('stat-top').textContent      = top ? `v${top.version}` : '—';

      const container = document.getElementById('table-container');
      if (stats.length === 0) {
        container.innerHTML = '<p class="loading-text">Aucun téléchargement enregistré.</p>';
        return;
      }

      const rows = stats.map(s => {
        const pct = Math.round((s.total / max) * 100);
        return `
          <tr>
            <td>v${s.version}</td>
            <td>
              <div class="bar-wrap">
                <div class="bar-bg"><div class="bar-fill" style="width:${pct}%"></div></div>
              </div>
            </td>
            <td>${s.total}</td>
          </tr>`;
      }).join('');

      container.innerHTML = `
        <table>
          <thead>
            <tr>
              <th>Version</th>
              <th>Répartition</th>
              <th>Téléchargements</th>
            </tr>
          </thead>
          <tbody>${rows}</tbody>
        </table>`;
    } catch (err) {
      document.getElementById('table-container').innerHTML =
        '<p class="loading-text">Erreur lors du chargement des données.</p>';
      console.error(err);
    }
  }

  /* ─── Init ───────────────────────────────────────────────────────────────── */
  checkExistingSession();
</script>
</body>
</html>

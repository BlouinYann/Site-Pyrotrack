<!DOCTYPE html>
<html lang="fr">
<head>
  <link rel="icon" type="image/png" href="../images/icon.png">
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PyroTrack System — Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;900&family=Barlow:wght@400;500;600&family=Share+Tech+Mono&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../style.css">
  <style>
    /* ── Layout général ── */
    body { background: #0a0a0a; color: #e0e0e0; }

    /* ── Login overlay ── */
    #login-overlay {
      position: fixed; inset: 0;
      background: #0a0a0a;
      display: flex; align-items: center; justify-content: center;
      z-index: 999;
    }
    .login-box {
      background: #111;
      border: 1px solid #2a2a2a;
      border-top: 3px solid #e63030;
      border-radius: 8px;
      padding: 2.5rem 3rem;
      width: 100%;
      max-width: 380px;
      display: flex; flex-direction: column; gap: 1.2rem;
    }
    .login-box h2 {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 1.6rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: #fff;
      margin: 0 0 0.5rem;
    }
    .login-box h2 em { color: #e63030; font-style: normal; }
    .login-field {
      display: flex; flex-direction: column; gap: 0.4rem;
    }
    .login-field label {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 0.85rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: #888;
    }
    .login-field input {
      background: #1a1a1a;
      border: 1px solid #2a2a2a;
      border-radius: 4px;
      padding: 0.65rem 0.9rem;
      color: #fff;
      font-family: 'Share Tech Mono', monospace;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s;
    }
    .login-field input:focus { border-color: #e63030; }
    .login-error {
      color: #e63030;
      font-family: 'Barlow', sans-serif;
      font-size: 0.85rem;
      min-height: 1.2em;
      text-align: center;
    }
    .btn-login {
      background: #e63030;
      color: #fff;
      border: none;
      border-radius: 4px;
      padding: 0.75rem;
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 1rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn-login:hover { background: #c02020; }

    /* ── Tentatives ── */
    .btn-login:disabled { background: #555; cursor: not-allowed; }

    /* ── Dashboard ── */
    #dashboard { display: none; padding: 3rem 2rem; max-width: 900px; margin: 0 auto; }
    .dashboard-header {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 2.5rem;
    }
    .dashboard-header h1 {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 2rem; font-weight: 900;
      text-transform: uppercase; letter-spacing: 0.05em;
      color: #fff; margin: 0;
    }
    .dashboard-header h1 em { color: #e63030; font-style: normal; }
    .btn-logout {
      background: transparent;
      border: 1px solid #444;
      color: #888;
      border-radius: 4px;
      padding: 0.4rem 1rem;
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 0.85rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      cursor: pointer;
      transition: border-color 0.2s, color 0.2s;
    }
    .btn-logout:hover { border-color: #e63030; color: #e63030; }

    /* ── Cards stats ── */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 1rem;
      margin-bottom: 2.5rem;
    }
    .stat-card {
      background: #111;
      border: 1px solid #2a2a2a;
      border-radius: 6px;
      padding: 1.2rem 1.5rem;
    }
    .stat-card .stat-label {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 0.8rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #666;
      margin-bottom: 0.4rem;
    }
    .stat-card .stat-value {
      font-family: 'Share Tech Mono', monospace;
      font-size: 2rem;
      color: #e63030;
      font-weight: 700;
    }

    /* ── Tableau ── */
    .section-label {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 1rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #666;
      margin-bottom: 1rem;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-family: 'Share Tech Mono', monospace;
      font-size: 0.9rem;
    }
    thead tr {
      border-bottom: 2px solid #e63030;
    }
    thead th {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 0.8rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: #888;
      text-align: left;
      padding: 0.5rem 0.8rem;
    }
    tbody tr {
      border-bottom: 1px solid #1e1e1e;
      transition: background 0.15s;
    }
    tbody tr:hover { background: #141414; }
    tbody td {
      padding: 0.7rem 0.8rem;
      color: #ccc;
    }
    tbody td:last-child { color: #e63030; font-weight: 700; }

    /* ── Bar chart ── */
    .bar-wrap {
      display: flex; align-items: center; gap: 0.8rem;
    }
    .bar-bg {
      flex: 1; height: 6px; background: #1e1e1e; border-radius: 3px; overflow: hidden;
    }
    .bar-fill {
      height: 100%; background: #e63030; border-radius: 3px;
      transition: width 0.6s ease;
    }

    /* ── Loading ── */
    .loading-text {
      font-family: 'Share Tech Mono', monospace;
      color: #444; font-size: 0.9rem; text-align: center; padding: 2rem;
    }
  </style>
</head>
<body>

<!-- ── Login ── -->
<div id="login-overlay">
  <div class="login-box">
    <h2>Pyro<em>Track</em> <br>Admin</h2>
    <div class="login-field">
      <label>Utilisateur</label>
      <input type="text" id="input-user" autocomplete="username" placeholder="Utilisateur" />
    </div>
    <div class="login-field">
      <label>Mot de passe</label>
      <input type="password" id="input-pass" autocomplete="current-password" placeholder="••••••••••••" />
    </div>
    <p class="login-error" id="login-error"></p>
    <button class="btn-login" id="btn-login">Connexion</button>
  </div>
</div>

<!-- ── Dashboard ── -->
<div id="dashboard">
  <div class="dashboard-header">
    <h1>Pyro<em>Track</em> — Stats</h1>
    <button class="btn-logout" id="btn-logout">Déconnexion</button>
  </div>

  <div class="stats-grid">
    <div class="stat-card">
      <div class="stat-label">Total téléchargements</div>
      <div class="stat-value" id="stat-total">—</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Versions suivies</div>
      <div class="stat-value" id="stat-versions">—</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Version la + téléchargée</div>
      <div class="stat-value" id="stat-top" style="font-size:1.3rem; padding-top: 0.3rem;">—</div>
    </div>
  </div>

  <p class="section-label">Détail par version</p>
  <div id="table-container">
    <p class="loading-text">Chargement des données...</p>
  </div>
</div>

<script>
  /* ── Hashes SHA-256 (ne pas modifier) ── */
  const USER_HASH = 'd44e1785d8ef83f2d215d50b6e20f94a7d092ddaa6789c7a4731c8d3b6a9b8dc';
  const PASS_HASH = 'ed42de115f834a4157c18fe9bdaa73a617a16c4d75ed5fc73e671b8bcfae0706';

  const MAX_ATTEMPTS = 5;
  const LOCKOUT_MS  = 5 * 60 * 1000; // 5 minutes

  /* ── Utilitaire SHA-256 ── */
  async function sha256(str) {
    const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
    return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
  }

  /* ── Anti-brute-force (sessionStorage) ── */
  function getAttempts() { return parseInt(sessionStorage.getItem('adm_att') || '0'); }
  function getLockout()  { return parseInt(sessionStorage.getItem('adm_lock') || '0'); }
  function bumpAttempts() {
    const n = getAttempts() + 1;
    sessionStorage.setItem('adm_att', n);
    if (n >= MAX_ATTEMPTS) sessionStorage.setItem('adm_lock', Date.now() + LOCKOUT_MS);
    return n;
  }
  function resetAttempts() {
    sessionStorage.removeItem('adm_att');
    sessionStorage.removeItem('adm_lock');
  }

  /* ── Session ── */
  const SESSION_KEY = 'adm_ok';
  function isLoggedIn() { return sessionStorage.getItem(SESSION_KEY) === '1'; }

  /* ── Login ── */
  const overlay   = document.getElementById('login-overlay');
  const dashboard = document.getElementById('dashboard');
  const errorEl   = document.getElementById('login-error');
  const btnLogin  = document.getElementById('btn-login');

  async function tryLogin() {
    // Vérif lockout
    const lockUntil = getLockout();
    if (lockUntil && Date.now() < lockUntil) {
      const remaining = Math.ceil((lockUntil - Date.now()) / 1000);
      errorEl.textContent = `Trop de tentatives. Réessayez dans ${remaining}s.`;
      btnLogin.disabled = true;
      return;
    }

    const user = document.getElementById('input-user').value.trim();
    const pass = document.getElementById('input-pass').value;

    const [uHash, pHash] = await Promise.all([sha256(user), sha256(pass)]);

    if (uHash === USER_HASH && pHash === PASS_HASH) {
      resetAttempts();
      sessionStorage.setItem(SESSION_KEY, '1');
      overlay.style.display = 'none';
      dashboard.style.display = 'block';
      loadStats();
    } else {
      const attempts = bumpAttempts();
      const left = MAX_ATTEMPTS - attempts;
      errorEl.textContent = left > 0
        ? `Identifiants incorrects. ${left} tentative${left > 1 ? 's' : ''} restante${left > 1 ? 's' : ''}.`
        : `Compte verrouillé 5 minutes.`;
      btnLogin.disabled = attempts >= MAX_ATTEMPTS;
    }
  }

  btnLogin.addEventListener('click', tryLogin);
  document.addEventListener('keydown', e => { if (e.key === 'Enter') tryLogin(); });

  document.getElementById('btn-logout').addEventListener('click', () => {
    sessionStorage.removeItem(SESSION_KEY);
    location.reload();
  });

  /* ── Vérif session au chargement ── */
  if (isLoggedIn()) {
    overlay.style.display = 'none';
    dashboard.style.display = 'block';
    loadStats();
  }

  // Re-activer le bouton si lockout expiré
  const lockUntil = getLockout();
  if (lockUntil && Date.now() < lockUntil) {
    btnLogin.disabled = true;
    const interval = setInterval(() => {
      if (Date.now() >= getLockout()) {
        btnLogin.disabled = false;
        errorEl.textContent = '';
        resetAttempts();
        clearInterval(interval);
      } else {
        const remaining = Math.ceil((getLockout() - Date.now()) / 1000);
        errorEl.textContent = `Trop de tentatives. Réessayez dans ${remaining}s.`;
      }
    }, 1000);
  }

  /* ── Chargement des stats ── */
  async function loadStats() {
    try {
      const res  = await fetch('https://licence-pyrotrack-gen.onrender.com/download-stats');
      const data = await res.json();
      const stats = data.stats;

      const total = stats.reduce((sum, s) => sum + s.total, 0);
      const top   = stats[0];
      const max   = top ? top.total : 1;

      document.getElementById('stat-total').textContent    = total;
      document.getElementById('stat-versions').textContent = stats.length;
      document.getElementById('stat-top').textContent      = top ? `v${top.version}` : '—';

      const container = document.getElementById('table-container');
      if (stats.length === 0) {
        container.innerHTML = '<p class="loading-text">Aucun téléchargement enregistré.</p>';
        return;
      }

      const rows = stats.map(s => {
        const pct = Math.round((s.total / max) * 100);
        return `
          <tr>
            <td>v${s.version}</td>
            <td>
              <div class="bar-wrap">
                <div class="bar-bg"><div class="bar-fill" style="width:${pct}%"></div></div>
              </div>
            </td>
            <td>${s.total}</td>
          </tr>`;
      }).join('');

      container.innerHTML = `
        <table>
          <thead>
            <tr>
              <th>Version</th>
              <th>Répartition</th>
              <th>Téléchargements</th>
            </tr>
          </thead>
          <tbody>${rows}</tbody>
        </table>`;
    } catch (err) {
      document.getElementById('table-container').innerHTML =
        '<p class="loading-text">Erreur lors du chargement des données.</p>';
      console.error(err);
    }
  }
</script>

</body>
</html>
